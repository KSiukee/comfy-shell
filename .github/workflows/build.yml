name: build

# 只在需要出包时手动跑（Actions → build → Run workflow），平时推代码不构建。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-manual
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      FEEDBACK_SMTP_CODE: ${{ secrets.FEEDBACK_SMTP_CODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tauri CLI (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (tauri, no bundle)
        shell: pwsh
        run: |
          if ($env:FEEDBACK_SMTP_CODE) { "feedback channel: enabled" } else { "feedback channel: disabled (no secret)" }
          cd src-tauri
          tauri build --no-bundle

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: comfy-shell-windows-exe
          path: src-tauri/target/release/comfy-shell.exe
          if-no-files-found: error