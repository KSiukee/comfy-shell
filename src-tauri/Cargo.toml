[package]
name = "comfy-shell"
version = "0.125.1"
description = "Minimal Tauri shell for local ComfyUI image generation"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
tungstenite = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"
argon2 = "0.6"
chacha20poly1305 = "0.11"
rfd = { version = "0.16", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Memory"] }

# 构建产物清理门（#101）：这两行是**根因修复**，不是口味。
# ① incremental = false —— 本仓 target/debug/incremental 实测 120.9 GiB（它只缓存我们自己的
#    crate，依赖不走增量；关掉 = 每次重编本地那几个 crate，几秒到几分钟）。
# ② debug = 1 —— 只留行号表。debug = 2（默认）的完整调试信息 + *.pdb 才是另一个大头
#    （comfy_shell.pdb 一个 196 MB，每构建一份）。行号表够用：panic 与回溯照样给 file:line。
# 要完整调试信息时把这两行临时删掉；清理命令见 tools/qa/clean_build.py。
[profile.dev]
incremental = false
debug = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1




























