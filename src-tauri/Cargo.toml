[package]
name = "comfy-shell"
version = "0.40.0"
description = "Minimal Tauri shell for local ComfyUI image generation"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
tungstenite = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1




























